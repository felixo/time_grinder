[project]
name = "time-grinder-backend"
version = "0.1.0"
description = "Time Grinder Django backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.4,<2",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5"]

[tool.uv]
package = false
python-downloads = "never"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["grinder/tests"]
