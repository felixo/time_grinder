[project]
name = "time-grinder-backend"
version = "0.1.0"
description = "Time Grinder Django backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.4,<2",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.16.8",
]

[tool.uv]
package = false
python-downloads = "never"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["grinder/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
]
ignore = [
    "I001",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
